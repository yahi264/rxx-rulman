  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<body>
  <a class="skip" href="#app">İçeriğe geç</a>
  <div class="intro" id="intro" aria-hidden="true">

      <svg class="intro-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><circle cx="50" cy="50" r="20"/><g>

    </div>

      <div class="search-in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="searchInput" autocomplete="off"><kbd>Esc</kbd></div>
